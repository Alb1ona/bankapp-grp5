# Medarbejderportal på bankapp01 (intern server, 192.168.50.100, VLAN 50).
# Serverer den statiske medarbejder-frontend og proxy'er KUN det interne API
# (/api/v1/internal/) til den lokale uvicorn-instans (bankapp-internal, port 8001).
# Kunde-API'et (/api/v1/customer/) proxy'es ALDRIG herfra (API-02).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/employee;
    index index.html;

    # Kun det interne medarbejder-API.
    location /api/v1/internal/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Kunde-API proxy'es ALDRIG. Afvis eksplicit, så det heller ikke
    # rammer SPA-fallbacken nedenfor.
    location /api/v1/customer/ {
        return 404;
    }

    # SPA-fallback: ukendte stier serveres med index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
