# Netbank (kundeportal) på DMZ-webserveren.
# Serverer den statiske kunde-frontend og proxy'er KUN kunde-API'et
# (/api/v1/customer/) til bankapplikationen. Det interne medarbejder-API
# (/api/v1/internal/) må ALDRIG eksponeres fra DMZ (API-02).

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name netbank-grp5.sof60.dk;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name netbank-grp5.sof60.dk;

    ssl_certificate     /etc/letsencrypt/live/netbank-grp5.sof60.dk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/netbank-grp5.sof60.dk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/netbank;
    index index.html;

    # Kun kunde-API'et proxy'es til bankapplikationen.
    location /api/v1/customer/ {
        proxy_pass http://192.168.50.10:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internt API proxy'es ALDRIG. Afvis eksplicit, så det heller ikke
    # rammer SPA-fallbacken nedenfor.
    location /api/v1/internal/ {
        return 404;
    }

    # SPA-fallback: ukendte stier serveres med index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
